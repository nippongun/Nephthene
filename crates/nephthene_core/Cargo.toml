[package]
name = "nephthene_core"
version = "0.1.0"
edition = "2024"
description = "Nephthene core: weather clock, sun/moon, wind, weather map, rain, storms, audio mapping and the one Config. Pure Rust, no engine."

[dependencies]
glam = "0.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"
